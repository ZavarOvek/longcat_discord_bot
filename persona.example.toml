# Службові тексти персони. Почати: cp persona.example.toml persona.toml — далі
# розкоментуй і перепиши лише ті ключі, які хочеш змінити; решта лишиться
# вбудованою. Файл persona.toml у .gitignore і в репозиторій не потрапляє.
#
# Шлях задає PERSONA_FILE у .env (типово persona.toml). Значення — рядки;
# для багаторядкових зручні потрійні лапки TOML ('''…''').

# Правила оформлення відповідей — ідуть у системний промпт кожного запиту.
# style_suffix = '''…'''

# Стисле нагадування правил — підклеюється до останньої репліки користувача, коли історія переросла поріг.
# trailing_reminder = '''…'''

# Позначка про амнезію — лишається першою в історії каналу після /reset і кнопки 🧹.
# reset_marker = '''…'''

# Прохання переписати відповідь звичайним текстом — коли в неї протекла сира розмітка tool-викликів.
# markup_retry_note = '''…'''

# Доважок до промпта в каналах /mode zzz — єдиний текст, де дозволений плейсхолдер {version}.
# zzz_mode_prompt = '''…'''

# Шапка блоку з даними, які бот сам підкладає в промпт по сутностях із повідомлення.
# zzz_reference_header = '''…'''

# Прохання переписати відповідь мовою персони — коли спрацював мовний вартовий (LANG_GUARD=true).
# lang_guard_retry_note = '''…'''
